services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nibbles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naps}
      POSTGRES_DB: ${POSTGRES_DB:-nibbles_and_naps}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nibbles} -d ${POSTGRES_DB:-nibbles_and_naps}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nibbles}:${POSTGRES_PASSWORD:-naps}@db:5432/${POSTGRES_DB:-nibbles_and_naps}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OFF_BASE_URL: ${OFF_BASE_URL:-https://world.openfoodfacts.org}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-NibblesAndNaps/1.0 (self-hosted)}
      OFF_TIMEOUT_MS: ${OFF_TIMEOUT_MS:-8000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
